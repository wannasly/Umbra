name: Сообщить об ошибке
description: Воспроизводимая проблема в Umbra
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Спасибо за отчёт. Не публикуйте ссылку подписки, токены, UUID, HWID или полный конфиг.
  - type: input
    id: version
    attributes:
      label: Версия Umbra
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Режим
      options:
        - Не подключено
        - Системный прокси
        - TUN
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть...
        2. Нажать...
        3. Получить...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение и очищенный журнал
      description: Замените домены, IP, UUID, токены и HWID тестовыми значениями.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: Я удалил(а) ссылки подписок, токены, UUID, IP, домены серверов и HWID.
          required: true
