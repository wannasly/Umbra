name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SING_BOX_VERSION: "1.13.14"
  SING_BOX_ARCHIVE_SHA256: "f580782c6dd10f7691c66cea1d7c421813c5fbf7e305d1ee7ce0c3a40d196341"

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Download verified sing-box core
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sing-box.zip"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$env:SING_BOX_VERSION/sing-box-$env:SING_BOX_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SING_BOX_ARCHIVE_SHA256) {
            throw "sing-box archive checksum mismatch: $actual"
          }
          $expanded = Join-Path $env:RUNNER_TEMP "sing-box"
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          Copy-Item -LiteralPath "$expanded/sing-box-$env:SING_BOX_VERSION-windows-amd64/sing-box.exe" -Destination "src-tauri/resources/sing-box.exe"

      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --features smoke-test --locked

      - name: Verify native startup on clean Windows
        shell: pwsh
        run: |
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          $env:UMBRA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'UmbraNativeStartup'
          $stderr = Join-Path $env:RUNNER_TEMP 'umbra-startup.stderr.log'
          $app = Start-Process target/debug/umbra.exe -PassThru -WindowStyle Hidden -RedirectStandardError $stderr
          $null = $app.Handle
          try {
            Start-Sleep -Seconds 3
            $startupLog = Get-Content -LiteralPath $stderr -Raw
            if ($app.HasExited -or $startupLog -match '(?m)^Umbra:') { throw "Native startup failed.`n$startupLog" }
            if (-not (Test-Path (Join-Path $env:UMBRA_DATA_DIR 'bin/sing-box.exe'))) { throw 'Bundled core was not discovered' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id; $null = $app.WaitForExit(10000) }
          }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-startup-diagnostics
          path: ${{ runner.temp }}/umbra-startup.stderr.log
