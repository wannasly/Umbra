name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish verified installer and portable archive as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

env:
  SING_BOX_VERSION: "1.13.14"
  SING_BOX_ARCHIVE_SHA256: "f580782c6dd10f7691c66cea1d7c421813c5fbf7e305d1ee7ce0c3a40d196341"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Determine and validate package version
        id: package
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot read package version" }
          $version = ($metadata.packages | Where-Object name -eq 'umbra').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and package version do not match" }
          if ($env:PUBLISH_RELEASE -eq 'true' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw "Manual publication must use main" }
          if (-not (Test-Path -LiteralPath "docs/RELEASE_v$version.md")) { throw "Release notes are missing" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download verified sing-box core
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sing-box.zip"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$env:SING_BOX_VERSION/sing-box-$env:SING_BOX_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SING_BOX_ARCHIVE_SHA256) {
            throw "sing-box archive checksum mismatch: $actual"
          }
          $expanded = Join-Path $env:RUNNER_TEMP "sing-box"
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          Copy-Item -LiteralPath "$expanded/sing-box-$env:SING_BOX_VERSION-windows-amd64/sing-box.exe" -Destination "src-tauri/resources/sing-box.exe"

      - name: Test
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build native Rust application
        run: cargo build --release --locked

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Package release files
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify portable archive and installed application
        shell: pwsh
        run: ./scripts/test-package.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Umbra-Windows-x64
          path: |
            release/*
            ${{ runner.temp }}/umbra-app-smoke.stderr.log

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: docs/RELEASE_v${{ steps.package.outputs.version }}.md
          files: release/*
