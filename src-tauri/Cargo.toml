[package]
name = "umbra"
version = "0.3.0"
description = "Umbra — a sleek sing-box GUI client"
authors = ["umbra"]
edition = "2021"

[features]
smoke-test = []

[lib]
name = "umbra_lib"
crate-type = ["rlib"]

[build-dependencies]
winresource = "0.1"
slint-build = "=1.15.1"

[dependencies]
slint = { version = "=1.15.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
arboard = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
directories = "6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "net", "fs", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"

base64 = "0.22"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
zip = "2"
sha2 = "0.10"
semver = "1"
rand = "0.8"
regex = "1"

[dev-dependencies]
tempfile = "3"
i-slint-backend-testing = "=1.15.1"

[target."cfg(windows)".dependencies]
winreg = "0.56"
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinInet",
  "Win32_UI_Shell",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_RemoteDesktop",
] }
