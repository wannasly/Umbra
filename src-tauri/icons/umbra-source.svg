<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b33"/>
      <stop offset="0.55" stop-color="#0b0e17"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="crescent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a99bff"/>
      <stop offset="0.5" stop-color="#7c6cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#7c6cf6" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7c6cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c6cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- rounded-square app background -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#glow)"/>
  <rect x="70" y="70" width="884" height="884" rx="194" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>

  <!-- eclipse: light disc occluded by the dark "umbra" disc -->
  <g>
    <circle cx="512" cy="512" r="252" fill="url(#crescent)" filter="url(#soft)" opacity="0.55"/>
    <circle cx="512" cy="512" r="248" fill="url(#crescent)"/>
    <circle cx="600" cy="424" r="212" fill="#0b0e17"/>
  </g>

  <!-- tiny star accents -->
  <circle cx="716" cy="644" r="10" fill="#22d3ee" opacity="0.9"/>
  <circle cx="330" cy="316" r="7" fill="#a99bff" opacity="0.8"/>
  <circle cx="668" cy="270" r="5" fill="#e2e8f0" opacity="0.7"/>
</svg>
